name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also verify the iOS build (macOS runner)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the release step gets write access.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the GitHub release on version tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Optional production signing: add these repository secrets to sign
      # with your own upload key instead of the shared dev key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured: using the shared dev key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      # versionName comes from the tag (v1.2.3 -> 1.2.3) or pubspec.yaml;
      # versionCode is the run number, so every build installs over the last.
      - name: Resolve version
        id: version
        run: |
          PUB_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            LABEL="$GITHUB_REF_NAME"
          else
            NAME="$PUB_VERSION"
            LABEL="build-${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Building version $NAME (code ${{ github.run_number }}) as $LABEL"

      - name: Build release APK (universal, installable on any phone)
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Build per-ABI APKs (smaller downloads)
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Build app bundle (for Google Play)
        if: startsWith(github.ref, 'refs/tags/v')
        # The APKs are the priority deliverable; never block the release on the AAB.
        continue-on-error: true
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Collect artifacts
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p dist
          out=build/app/outputs
          cp "$out/flutter-apk/app-release.apk" "dist/redemption-$LABEL-universal.apk"
          cp "$out/flutter-apk/app-arm64-v8a-release.apk" "dist/redemption-$LABEL-arm64-v8a.apk"
          cp "$out/flutter-apk/app-armeabi-v7a-release.apk" "dist/redemption-$LABEL-armeabi-v7a.apk"
          if [ -f "$out/bundle/release/app-release.aab" ]; then
            cp "$out/bundle/release/app-release.aab" "dist/redemption-$LABEL.aab"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: redemption-android
          path: dist/
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Redemption ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  ios:
    name: Verify iOS build (no codesign)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (simulator-agnostic, unsigned)
        run: flutter build ios --release --no-codesign
