name: redemption
description: "Redemption — rewire your brain in 90 days. A fully customisable daily discipline tracker."
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Persistence
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Platform services
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

  # UI
  fl_chart: ^1.2.0
  confetti: ^0.8.0
  dynamic_color: ^2.1.0

  # Utilities
  archive: ^4.4.0
  collection: ^1.19.1
  crypto: ^3.0.7
  intl: ^0.20.3
  logging: ^1.3.0
  cross_file: ^0.3.5
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
